server:
  http_listen_port: 3200

compactor:
  compaction:
    compaction_window: 1h
    # Keep traces 7 days (SCO-3462). Unset, Tempo keeps 14 days.
    block_retention: 168h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces

distributor:
  # Off: on, Tempo writes every span it receives into its own log.
  log_received_spans:
    enabled: false
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"