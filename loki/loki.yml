auth_enabled: false

server:
  http_listen_port: 3100
  log_level: info

common:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
  replication_factor: 1
  path_prefix: /loki

schema_config:
  configs:
  - from: 2025-01-01
    index:
      period: 24h
      prefix: index_
    store: tsdb
    object_store: filesystem
    schema: v13

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache
  # Chunks and the shipped TSDB index MUST live on the /loki volume. Without
  # this key Loki resolves the directory "" to its working directory (/), which
  # is the container's own disk: every Railway deploy replaced it and took all
  # logs with it (Feb-Jul 2026 were lost on the 30 July 2026 deploy). SCO-2995.
  filesystem:
    directory: /loki/chunks

# Retention (SCO-2995). The firehose holds client IP addresses and user agents,
# so it is kept 30 days. The curated security stream is kept 12 months, the
# maximum the privacy policy allows for server and security logs.
compactor:
  # On the volume: marker files for chunks pending deletion must survive a restart.
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  # Chunks are swept this long after they are marked. Turn retention off inside
  # this window to cancel a wrong setting.
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  # Required when retention_enabled is true. The object store from schema_config.
  delete_request_store: filesystem

limits_config:
  retention_period: 720h # 30 days
  retention_stream:
    - selector: '{stream="security"}'
      priority: 1
      period: 8760h # 12 months
